name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - '*.x'
            - 'main'
        tags:
            - 'v*.*.*'

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm typecheck

    test:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:coverage
            - name: Upload coverage
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: js-coverage
                  path: coverage/clover.xml
                  if-no-files-found: ignore
                  retention-days: 30

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build

    coverage:
        name: Coverage
        needs: [test]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: write
        uses: silarhi/.github/.github/workflows/coverage-report.yml@main

    # Single required status check for the `main` ruleset, whatever the jobs above become.
    ci-passed:
        name: CI passed
        needs: [lint, test, build]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
